<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Man &mdash; Race &amp; Battle</title>
  <!-- styling lives in default.css -->
  <link rel="stylesheet" href="default.css">
</head>
<body>

  <!-- ============ START SCREEN (plain HTML) ============ -->
  <div id="startScreen">
    <h1>PAC-MAN</h1>
    <div class="subtitle">race &amp; battle</div>

    <div class="section">MODE</div>
    <div class="row" id="modeRow"></div>

    <div class="section">PLAYERS</div>
    <div class="row" id="countRow"></div>

    <div id="playersPanel"></div>

    <button id="startBtn">START GAME</button>
    <div class="hint">Controls - P1: Arrows &nbsp;|&nbsp; P2: WASD &nbsp;|&nbsp; P3: IJKL &nbsp;|&nbsp; P4: TFGH &nbsp;|&nbsp; ESC: menu</div>
  </div>

  <canvas id="game"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
