<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Man &mdash; Race &amp; Battle</title>
  <!-- styling lives in default.css -->
  <link rel="stylesheet" href="default.css">
</head>
<body>

  <!-- ============ START SCREEN (plain HTML) ============ -->
  <div id="startScreen">
    <h1>PAC-MAN</h1>
    <div class="subtitle">race &amp; battle</div>

    <div class="section">MODE</div>
    <div class="row" id="modeRow"></div>

    <div class="section">PLAYERS</div>
    <div class="row" id="countRow"></div>

    <div class="section">ICONS&nbsp;&nbsp;(placeholders &mdash; drop player1.png &hellip; player4.png into the assets folder to customise)</div>
    <div id="playersPanel"></div>

    <button id="startBtn">START GAME</button>
    <div class="hint">Controls &mdash; P1: Arrows &nbsp;|&nbsp; P2: WASD &nbsp;|&nbsp; P3: IJKL &nbsp;|&nbsp; P4: Numpad 8/5/4/6 &nbsp;|&nbsp; ESC: menu</div>
  </div>

  <!-- ============ GAME CANVAS ============ -->
  <canvas id="game"></canvas>

  <!-- all the game code lives in main.js (loaded last so the elements above exist) -->
  <script src="main.js"></script>
</body>
</html>
